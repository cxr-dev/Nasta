<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logosvg.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#635BFF" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Nästa - Swedish public transit commute tracker"
    />
    <script>
      (() => {
        let preference = "system";
        try {
          const stored = JSON.parse(localStorage.getItem("nasta_settings") || "{}");
          if (stored.theme === "light" || stored.theme === "dark" || stored.theme === "system") {
            preference = stored.theme;
          }
        } catch {
          // Keep the system default when saved settings cannot be read.
        }

        const theme = preference === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === "dark" ? "#111311" : "#F7F7F5";
      })();
    </script>

    <!-- iOS home screen support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nästa" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SL departure API — prefetch DNS before JS loads -->
    <link rel="dns-prefetch" href="https://transport.integration.sl.se" />
    <link rel="preconnect" href="https://transport.integration.sl.se" />

    <!-- Fonts: Neue Machina for display, Satoshi for body — async, non-blocking -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preload" as="image" href="%BASE_URL%logosvg.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="font"
      href="%BASE_URL%fonts/bricolage-grotesque-latin-800.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="%BASE_URL%fonts/dm-sans-latin-500-700.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=neue-machina@700,800&f[]=satoshi@400,500,700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=neue-machina@700,800&f[]=satoshi@400,500,700&display=swap"
      />
    </noscript>

    <!-- corsproxy.io is a dev-mode CORS proxy fallback for the Visit Stockholm events API (src/services/eventService.ts); production uses events-data.json build-time static file -->
    <!-- Dev-only CSP allowances for $impeccable live mode (localhost:8400). Only resolves in dev. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' transport.integration.sl.se deviations.integration.sl.se journeyplanner.integration.sl.se basemaps.cartocdn.com *.basemaps.cartocdn.com izrgqxgsuhogrukisfrd.supabase.co overpass-api.de api.visitstockholm.com *.visitstockholm.com commons.wikimedia.org corsproxy.io api.open-meteo.com nominatim.openstreetmap.org http://localhost:8400; font-src 'self' api.fontshare.com cdn.fontshare.com; img-src 'self' data: blob: basemaps.cartocdn.com *.basemaps.cartocdn.com upload.wikimedia.org commons.wikimedia.org; script-src 'self' 'unsafe-inline' http://localhost:8400; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://api.fontshare.com; frame-src 'none'; object-src 'none'">
    <title>Nästa</title>
    <style>
      /* Prevent pull-to-refresh and overscroll */
      html,
      body {
        overscroll-behavior: none;
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg, #f7f7f5);
      }
      @font-face {
        font-family: "Bricolage Grotesque Launch";
        src: url("%BASE_URL%fonts/bricolage-grotesque-latin-800.woff2") format("woff2");
        font-style: normal;
        font-weight: 800;
        font-stretch: 75% 100%;
        font-display: swap;
      }
      @font-face {
        font-family: "DM Sans Launch";
        src: url("%BASE_URL%fonts/dm-sans-latin-500-700.woff2") format("woff2");
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
      }
      html[data-theme="dark"] {
        --boot-bg: #111311;
        --launch-ink: #f5f5ef;
        --launch-muted: rgba(245, 245, 239, 0.66);
        --launch-route-base: rgba(245, 245, 239, 0.21);
        --launch-soft: rgba(245, 245, 239, 0.11);
      }
      html[data-theme="light"] {
        --boot-bg: #f7f7f5;
        --launch-ink: #171b18;
        --launch-muted: #555b55;
        --launch-route-base: rgba(23, 27, 24, 0.18);
        --launch-soft: rgba(23, 27, 24, 0.1);
      }
      /* Ensure inputs don't zoom on iOS */
      input,
      select,
      textarea {
        font-size: 16px;
      }
      /* Skip-to-content link — visible on focus, hidden otherwise */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        z-index: 10000;
        padding: 8px 16px;
        background: var(--accent, #171717);
        color: var(--text-on-accent, #fff);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 8px 0;
      }
      .skip-link:focus {
        top: 0;
      }

      #nasta-launch {
        --launch-safe-top: env(safe-area-inset-top, 0px);
        --launch-safe-right: env(safe-area-inset-right, 0px);
        --launch-safe-bottom: env(safe-area-inset-bottom, 0px);
        --launch-safe-left: env(safe-area-inset-left, 0px);
        position: fixed;
        inset: 0;
        z-index: 600;
        overflow: hidden;
        background: var(--boot-bg);
        color: var(--launch-ink);
        transition: opacity 120ms cubic-bezier(0.25, 1, 0.5, 1);
      }
      #nasta-launch.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .launch-route {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .launch-route-base,
      .launch-route-active {
        fill: none;
        stroke-linecap: round;
      }
      .launch-route-base {
        stroke: var(--launch-route-base);
        stroke-width: 4;
      }
      .launch-route-active {
        stroke: var(--launch-ink);
        stroke-width: 5;
        stroke-dasharray: 0 1000;
        animation: launch-route-draw 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .launch-station-halo,
      .launch-traveller-halo {
        fill: var(--launch-soft);
      }
      .launch-station-ring,
      .launch-traveller-ring {
        fill: var(--boot-bg);
        stroke: var(--launch-ink);
        stroke-width: 4;
      }
      .launch-station-destination {
        stroke: color-mix(in srgb, var(--launch-ink) 38%, transparent);
        transform-box: fill-box;
        transform-origin: center;
        animation: launch-destination-arrival 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .launch-station-core,
      .launch-traveller-arrow {
        fill: var(--launch-ink);
      }
      .launch-station-label {
        fill: var(--launch-muted);
        font-family: "DM Sans Launch", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.075em;
      }
      .launch-traveller {
        offset-path: path("M -25 686 C 5 676 29 663 54 650 C 120 595 189 687 250 620 C 286 578 316 559 340 570 C 366 581 391 594 420 586");
        offset-rotate: auto;
        animation: launch-travel 4.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      .launch-traveller-ring {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
      }
      .launch-brand {
        position: absolute;
        top: 19.5%;
        top: max(19.5svh, calc(var(--launch-safe-top) + 16px));
        left: var(--launch-safe-left);
        right: var(--launch-safe-right);
        z-index: 5;
        text-align: center;
      }
      .launch-logo {
        display: block;
        width: min(57vw, 222.3px);
        height: auto;
        margin: 0 auto;
        filter: drop-shadow(0 10px 18px rgba(18, 23, 18, 0.12));
      }
      html[data-theme="dark"] .launch-logo {
        filter: invert(1) brightness(1.12) drop-shadow(0 12px 20px rgba(0, 0, 0, 0.26));
      }
      .launch-name {
        margin: 14px 0 0;
        font-family: "Bricolage Grotesque Launch", "Arial Black", sans-serif;
        font-size: clamp(60px, 18.46vw, 72px);
        font-weight: 800;
        line-height: 0.84;
        letter-spacing: -0.05em;
      }
      .launch-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 18px 0 0;
        font-family: "DM Sans Launch", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        color: var(--launch-muted);
      }
      .launch-loading-mark {
        position: relative;
        width: 18px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--launch-soft);
      }
      .launch-loading-mark::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 50%;
        border-radius: inherit;
        background: var(--launch-ink);
        animation: launch-loading-shuttle 1.35s cubic-bezier(0.45, 0, 0.2, 1) infinite alternate;
      }
      .launch-readout {
        position: absolute;
        left: max(34px, calc(var(--launch-safe-left) + 16px));
        right: max(34px, calc(var(--launch-safe-right) + 16px));
        bottom: calc(62px + var(--launch-safe-bottom));
        z-index: 5;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        padding-top: 13px;
        border-top: 1px solid var(--launch-route-base);
        font-family: "DM Sans Launch", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .launch-readout-label {
        color: var(--launch-muted);
        font-size: 9px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.08em;
      }
      .launch-readout-line {
        height: 1px;
        background: var(--launch-route-base);
      }
      .launch-readout-destination {
        color: var(--launch-ink);
        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.025em;
      }
      @keyframes launch-route-draw {
        0% { stroke-dasharray: 0 1000; }
        68%, 100% { stroke-dasharray: 1000 0; }
      }
      @keyframes launch-travel {
        0% { offset-distance: 17.76%; }
        68%, 100% { offset-distance: 82.95%; }
      }
      @keyframes launch-destination-arrival {
        0%, 58% {
          stroke: color-mix(in srgb, var(--launch-ink) 38%, transparent);
          transform: scale(1);
        }
        68% {
          stroke: var(--launch-ink);
          transform: scale(1.28);
        }
        78%, 100% {
          stroke: var(--launch-ink);
          transform: scale(1);
        }
      }
      @keyframes launch-loading-shuttle {
        from { transform: translateX(-100%); }
        to { transform: translateX(200%); }
      }
      @media (orientation: portrait) and (max-height: 699px) {
        .launch-brand {
          top: 12%;
          top: max(12svh, calc(var(--launch-safe-top) + 16px));
        }
        .launch-logo { width: min(52vw, 168px); }
        .launch-name { font-size: 56px; }
        .launch-route { transform: translateY(-72px); }
        .launch-readout { bottom: calc(28px + var(--launch-safe-bottom)); }
      }
      @media (orientation: landscape) and (max-height: 520px) {
        .launch-brand {
          top: calc(var(--launch-safe-top) + 16px);
          left: var(--launch-safe-left);
          right: 50%;
        }
        .launch-logo { width: min(29vw, 128px); }
        .launch-name {
          margin-top: 8px;
          font-size: 46px;
        }
        .launch-label { margin-top: 10px; }
        .launch-route {
          inset: auto 0 auto auto;
          top: 50%;
          width: 195px;
          height: 422px;
          transform: translateY(-50%);
        }
        .launch-station-label,
        .launch-readout { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #nasta-launch { transition: none; }
        .launch-route-active,
        .launch-station-destination,
        .launch-traveller,
        .launch-loading-mark::after { animation: none; }
        .launch-route-active { stroke-dasharray: 1000 0; }
        .launch-station-destination {
          stroke: var(--launch-ink);
          transform: scale(1);
        }
        .launch-traveller { offset-distance: 55%; }
        .launch-loading-mark::after { transform: translateX(50%); }
      }

    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="nasta-launch" aria-hidden="true">
      <div class="launch-brand">
        <img class="launch-logo" src="%BASE_URL%logosvg.svg" alt="" />
        <p class="launch-name">Nästa</p>
        <p class="launch-label"><i class="launch-loading-mark"></i>Hämtar avgångar</p>
      </div>
      <svg
        class="launch-route"
        viewBox="0 0 390 844"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
      >
        <path
          class="launch-route-base"
          d="M -25 686 C 5 676 29 663 54 650 C 120 595 189 687 250 620 C 286 578 316 559 340 570 C 366 581 391 594 420 586"
        />
        <path
          class="launch-route-active"
          pathLength="1000"
          d="M -25 686 C 5 676 29 663 54 650 C 120 595 189 687 250 620 C 286 578 316 559 340 570 C 366 581 391 594 420 586"
        />
        <circle class="launch-station-halo" cx="54" cy="650" r="16" />
        <circle class="launch-station-ring launch-station-origin" cx="54" cy="650" r="9" />
        <circle class="launch-station-core" cx="54" cy="650" r="3" />
        <circle class="launch-station-halo" cx="340" cy="570" r="16" />
        <circle class="launch-station-ring launch-station-destination" cx="340" cy="570" r="9" />
        <text class="launch-station-label" x="30" y="678">SLUSSEN</text>
        <text class="launch-station-label" x="286" y="598">T-CENTRALEN</text>
        <g class="launch-traveller">
          <circle class="launch-traveller-halo" r="17" />
          <circle class="launch-traveller-ring" r="10" />
          <path class="launch-traveller-arrow" d="M-3 -4 L4 0 L-3 4 Z" />
        </g>
      </svg>
      <div class="launch-readout">
        <span class="launch-readout-label">NÄSTA STOPP</span>
        <i class="launch-readout-line"></i>
        <strong class="launch-readout-destination">T-CENTRALEN</strong>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
