name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Full rebuild + deploy at 06:00 UTC (08:00 Stockholm) — catches morning commuters
    - cron: '0 6 * * *'
    # Full rebuild + deploy at 10:00 UTC (12:00 Stockholm) — events ready before afterwork
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run check

      - name: Run unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Write version.json
        run: echo '{"version":"${{ github.sha }}"}' > dist/version.json

      - name: Verify production artifact
        run: pnpm run verify:build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
